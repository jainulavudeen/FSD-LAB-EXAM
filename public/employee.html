<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
    .box { background: #fff; width: 100%; max-width: 480px; padding: 25px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
    h1 { color: #1976d2; text-align: center; margin-top: 0; }
    h3 { margin-bottom: 8px; }
    input { width: 100%; padding: 10px; margin-bottom: 8px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { width: 100%; padding: 10px; background: #1976d2; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 15px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 8px; white-space: pre-wrap; min-height: 40px; }
    a { color: #1976d2; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Employee Management</h1>

    <h3>1. Search Employee</h3>
    <input type="number" id="searchId" placeholder="Enter employeeId (e.g. 101)">
    <button onclick="searchEmployee()">Search</button>

    <h3>2. Update Salary</h3>
    <input type="number" id="updateId" placeholder="Enter employeeId">
    <input type="number" id="newSalary" placeholder="Enter new salary">
    <button onclick="updateSalary()">Update Salary</button>

    <h3>Result</h3>
    <pre id="result"></pre>
    <p><a href="/">← Back to Food Ordering Form</a></p>
  </div>

  <script>
    const out = document.getElementById('result');

    async function searchEmployee() {
      const id = document.getElementById('searchId').value;
      if (!id) { out.textContent = 'Enter an employeeId'; return; }
      const res = await fetch('/employee/' + id);
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function updateSalary() {
      const id = document.getElementById('updateId').value;
      const salary = Number(document.getElementById('newSalary').value);
      if (!id || !salary) { out.textContent = 'Enter employeeId and salary'; return; }
      const res = await fetch('/employee/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ salary })
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }
  </script>
</body>
</html>
